
<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Galaxy for You ❤️</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
        }
        #intro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: opacity 1s ease;
        }
        h1 {
            font-size: 2rem;
            color: #ff69b4;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 20px;
        }
        button {
            background-color: #ff1493;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <!-- ပထမဆုံးပေါ်မည့် စာသားနှင့် ခလုတ် (ဤနေရာတွင် သင်ကြိုက်သည့် စာသားပြောင်းနိုင်သည်) -->
    <div id="intro">
        <h1>Una Galaxia de Amor para Ti</h1>
        <p>FELIZ CUMPLEANOS, MI VIDA</p>
        <button onclick="startExperience()">ENTRAR A NUESTRO UNIVERSO</button>
    </div>

    <!-- 3D နှလုံးသား ဂယ်လက်ဆီ ပေါ်မည့်နေရာ -->
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function startExperience() {
            document.getElementById('intro').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro').style.display = 'none';
                document.getElementById('canvas-container').style.display = 'block';
                initGalaxy();
            }, 1000);
        }

        function initGalaxy() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // နှလုံးပုံစံ အစက်များနှင့် ဂယ်လက်ဆီ ဖန်တီးခြင်း
            const particlesCount = 3000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount; i++) {
                // နှလုံးပုံသဏ္ဌာန် သင်္ချာညီမျှခြင်း
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const z = (Math.random() - 0.5) * 10;

                positions[i * 3] = x * 0.8;
                positions[i * 3 + 1] = y * 0.8;
                positions[i * 3 + 2] = z;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.15,
                color: 0xff69b4,
                transparent: true,
                opacity: 0.8
            });

            const heartParticles = new THREE.Points(geometry, material);
            scene.add(heartParticles);

            camera.position.z = 30;

            function animate() {
                requestAnimationFrame(animate);
                heartParticles.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
