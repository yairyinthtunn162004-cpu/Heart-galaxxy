<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una Galaxia de Amor para Ti</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }
        #intro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 85%;
            max-width: 400px;
            padding: 25px;
            background: rgba(20, 0, 10, 0.85);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.5);
            transition: opacity 1s ease;
        }
        h1 {
            font-size: 1.5rem;
            color: #ff69b4;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 20px;
        }
        button {
            background-color: #ff1493;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 0.9rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.8);
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <div id="intro">
        <h1>Una Galaxia de Amor para Ti</h1>
        <p>FELIZ CUMPLEANOS, MI VIDA</p>
        <button onclick="startExperience()">ENTRAR A NUESTRO UNIVERSO</button>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function startExperience() {
            document.getElementById('intro').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro').style.display = 'none';
                document.getElementById('canvas-container').style.display = 'block';
                initGalaxy();
            }, 1000);
        }

        function initGalaxy() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const particlesCount = 8000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particlesCount * 3);
            const colors = new Float32Array(particlesCount * 3);

            const color1 = new THREE.Color(0xff1493);
            const color2 = new THREE.Color(0xff69b4);

            for (let i = 0; i < particlesCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.sin(t) * Math.sin(t) * Math.sin(t);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const z = (Math.random() - 0.5) * 12;

                positions[i * 3] = x * 0.8;
                positions[i * 3 + 1] = y * 0.8;
                positions[i * 3 + 2] = z;

                colors[i * 3] = color1.r;
                colors[i * 3 + 1] = color1.g;
                colors[i * 3 + 2] = color1.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.9
            });

            const heartParticles = new THREE.Points(geometry, material);
            scene.add(heartParticles);

            camera.position.z = 30;

            function animate() {
                requestAnimationFrame(animate);
                heartParticles.rotation.y += 0.01;
                heartParticles.rotation.x += 0.003;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
